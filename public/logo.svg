<svg version="1.0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" xml:space="preserve">
  <defs>
    <clipPath id="flagClip">
      <rect x="3" y="6" width="24" height="18" rx="3" ry="3"/>
    </clipPath>
  </defs>
  <!-- Rounded background -->
  <rect x="3" y="6" width="24" height="18" rx="3" ry="3" fill="#006233" stroke="#FFFFFF" stroke-width="0.5"/>
  <!-- Green stripe (top) -->
  <g clip-path="url(#flagClip)">
    <rect x="3" y="6" width="24" height="9" fill="#006233"/>
    <!-- White stripe (bottom) -->
    <rect x="3" y="15" width="24" height="9" fill="#FFFFFF"/>
    <!-- Red crescent and star -->
    <g transform="translate(15,15)">
      <!-- Crescent -->
      <circle cx="0" cy="0" r="4.5" fill="#D21034"/>
      <circle cx="1.2" cy="-0.5" r="3.8" fill="#006233"/>
      <!-- Star -->
      <polygon points="0,-5.5 0.9,-2 4.5,-2 1.7,0.2 2.8,3.5 0,1.5 -2.8,3.5 -1.7,0.2 -4.5,-2 -0.9,-2" fill="#D21034" transform="translate(-1.5,0) scale(0.55)"/>
    </g>
  </g>
  <!-- Subtle shadow -->
  <rect x="3" y="6" width="24" height="18" rx="3" ry="3" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
</svg>